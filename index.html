<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Contrast Target VR</title>
    <!-- A-Frame Library (поддерживает WebXR из коробки) -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
</head>
<body>
    <!-- VR Сцена -->
    <a-scene webxr="requiredFeatures: hit-test, local-floor;">
        <!-- Камера -->
        <a-entity position="0 1.6 0">
            <a-camera look-controls></a-camera>
            <!-- Контроллер Quest (Правый/Левый курок) -->
            <a-entity oculus-touch-controls="hand: right" id="rightHand"></a-entity>
            <a-entity oculus-touch-controls="hand: left" id="leftHand"></a-entity>
        </a-entity>

        <!-- Задний фон (Экран) -->
        <a-plane id="bgPlane" position="0 1.5 -2" width="4" height="3" color="#000000" material="shader: flat"></a-plane>

        <!-- Целевой шар -->
        <a-sphere id="targetBall" position="0 1.5 -1.95" radius="0.06" color="#ffffff" visible="false" material="shader: flat"></a-sphere>

        <!-- Источник света (минимальный) -->
        <a-sky color="#111111"></a-sky>
    </a-scene>

    <script>
        const STAGES = ['WHITE_ON_BLACK', 'GRAY_ON_WHITE', 'CLOSE_GRAYS'];
        let currentStageIndex = 0;
        let contrastLevel = 1.0;
        let trialResults = [];
        const TRIALS_PER_LEVEL = 8;
        let isWaitingForResponse = false;
        let appearanceTime = 0;

        const bgPlane = document.querySelector('#bgPlane');
        const targetBall = document.querySelector('#targetBall');
        const rightHand = document.querySelector('#rightHand');
        const leftHand = document.querySelector('#leftHand');

        // Обработка нажатия курка
        function onTriggerPressed() {
            if (!isWaitingForResponse) return;
            const reactionTime = performance.now() - appearanceTime;
            recordResult(true, reactionTime);
        }

        rightHand.addEventListener('triggerdown', onTriggerPressed);
        leftHand.addEventListener('triggerdown', onTriggerPressed);
        // Резервный клик для тестирования на ПК
        window.addEventListener('click', onTriggerPressed);

        function startNextTrial() {
            targetBall.setAttribute('visible', 'false');
            isWaitingForResponse = false;

            const delay = 1500 + Math.random() * 2000;

            setTimeout(() => {
                applyVisualSettings();

                // Случайная позиция в пределах экрана
                const randomX = (Math.random() - 0.5) * 1.2;
                const randomY = 1.5 + (Math.random() - 0.5) * 0.8;
                targetBall.setAttribute('position', `${randomX} ${randomY} -1.95`);

                targetBall.setAttribute('visible', 'true');
                isWaitingForResponse = true;
                appearanceTime = performance.now();

                setTimeout(() => {
                    if (isWaitingForResponse) {
                        recordResult(false, 0);
                    }
                }, 1500);

            }, delay);
        }

        function recordResult(success, reactionTime) {
            isWaitingForResponse = false;
            targetBall.setAttribute('visible', 'false');
            trialResults.push(success);

            console.log(`Попытка: ${success ? 'Успех (' + Math.round(reactionTime) + 'мс)' : 'Промах'}, Контраст: ${contrastLevel.toFixed(2)}`);

            if (trialResults.length >= TRIALS_PER_LEVEL) {
                evaluateProgress();
            } else {
                startNextTrial();
            }
        }

        function evaluateProgress() {
            const successCount = trialResults.filter(Boolean).length;
            const accuracy = successCount / TRIALS_PER_LEVEL;

            if (accuracy >= 0.8) {
                contrastLevel -= 0.15;
                if (contrastLevel < 0.05) {
                    advanceStage();
                } else {
                    startNextTrial();
                }
            } else {
                console.log(`Порог найден! Этап: ${STAGES[currentStageIndex]}, Мин. Контраст: ${contrastLevel.toFixed(2)}`);
                advanceStage();
            }
            trialResults = [];
        }

        function advanceStage() {
            contrastLevel = 1.0;
            currentStageIndex++;
            if (currentStageIndex < STAGES.length) {
                startNextTrial();
            } else {
                console.log("Тест завершен!");
            }
        }

        function applyVisualSettings() {
            const stage = STAGES[currentStageIndex];

            if (stage === 'WHITE_ON_BLACK') {
                bgPlane.setAttribute('color', '#000000');
                const val = Math.floor(contrastLevel * 255);
                targetBall.setAttribute('color', `rgb(${val},${val},${val})`);
            } else if (stage === 'GRAY_ON_WHITE') {
                bgPlane.setAttribute('color', '#ffffff');
                const val = Math.floor((1 - contrastLevel * 0.5) * 255);
                targetBall.setAttribute('color', `rgb(${val},${val},${val})`);
            } else if (stage === 'CLOSE_GRAYS') {
                bgPlane.setAttribute('color', 'rgb(128,128,128)');
                const val = Math.floor(128 + (contrastLevel * 20));
                targetBall.setAttribute('color', `rgb(${val},${val},${val})`);
            }
        }

        // Старт при входе в сцену
        document.querySelector('a-scene').addEventListener('loaded', () => {
            startNextTrial();
        });
    </script>
</body>
</html>
